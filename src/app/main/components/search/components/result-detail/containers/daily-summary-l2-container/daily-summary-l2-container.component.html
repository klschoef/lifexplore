<div class="daily-results-panel" *ngIf="results$ | async as results;">
  <div class="daily-header">
    <div class="previous-next-container">
      <button type="button" class="day-nav-button exp-clickable" (click)="decreaseDateByOneDay()">
        <mat-icon aria-hidden="true" fontIcon="chevron_left"></mat-icon>
        Previous day
      </button>
      <div class="current-day">{{navigated_date | date}}</div>
      <button type="button" class="day-nav-button exp-clickable" (click)="increaseDateByOneDay()">
        Next day
        <mat-icon aria-hidden="true" fontIcon="chevron_right"></mat-icon>
      </button>
    </div>
    <div class="pages-container" *ngIf="pages">
      <div
        class="page-container exp-clickable exp-hover-scale"
        (click)="loadPage(1)"
        *ngIf="currentPage > 4">
        1...
      </div>
      <div
        class="page-container exp-clickable exp-hover-scale"
        (click)="loadPage(p)"
        [class.active]="currentPage === p"
        *ngFor="let p of pages">
        {{ p }}
      </div>
      <div
        class="page-container exp-clickable exp-hover-scale"
        (click)="loadPage(totalPages)"
        *ngIf="currentPage < totalPages - 3">
        ...{{ totalPages }}
      </div>
    </div>
    <div class="exp-clickable sorting-container" (click)="changeSorting()">
      {{ ascending ? 'Oldest first' : 'Newest first' }}
    </div>
  </div>
  <app-minimal-result-container
    [results]="results"
    [localMode]="true"
    [previousPageTrigger$]="previousPageTrigger$"
    [nextPageTrigger$]="nextPageTrigger$"
    [openPageTrigger$]="openPageTrigger$"
    [lockEscapeInParent$]="lockEscapeInParent$"
    [detailModes]="detailModes"
    [initialSelectedResult]="result"/>
</div>
